name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Docker
        run: docker build -t usk .

      - name: Export firmware to out/
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/export" usk
          ls -la out/

      - name: Upload firmware.uf2
        uses: actions/upload-artifact@v4
        with:
          name: firmware.uf2
          path: out/firmware.uf2
          if-no-files-found: error

      - name: Upload update.bin
        uses: actions/upload-artifact@v4
        with:
          name: update.bin
          path: out/update.bin
          if-no-files-found: error
